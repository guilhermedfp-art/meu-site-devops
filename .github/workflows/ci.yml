name: Pipeline DevOps Aula

on:
  push:
    branches:
      - teste-falha-ci

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
      - name: Listar arquivos
        run: ls -la
      - name: Mostrar data
        run: date

  validation:
    name: Validação
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
      - name: Verificar index.html
        run: |
          if [ ! -f index.html ]; then
            echo "Erro: index.html não encontrado!"
            exit 1
          fi
          echo "Arquivo OK"

  build:
    name: Build simulado
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
      - name: Copiar site para dist
        run: |
          mkdir -p dist
          cp index.html dist/
          ls -la dist

  deploy:
    name: Deploy informativo
    runs-on: ubuntu-latest
    steps:
      - name: Mostrar mensagem de deploy
        run: echo "Cloudflare fará deploy automaticamente"


